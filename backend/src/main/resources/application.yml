spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:wkt_db}
    username: ${DB_USER:wkt}
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}

gemini:
  apiKey: ${GEMINI_API_KEY:}
  modelChunk: ${GEMINI_MODEL_CHUNK:gemini-1.0}
  modelFinal: ${GEMINI_MODEL_FINAL:gemini-1.0-final}

management:
  endpoints:
    web:
      exposure:
        include: health,info

flyway:
  enabled: true
