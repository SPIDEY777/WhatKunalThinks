version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-wkt_db}
      POSTGRES_USER: ${DB_USER:-wkt}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-wkt}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: eclipse-temurin:21-jre
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - 8080:8080
    volumes:
      - ./backend/target/wkt-0.0.1-SNAPSHOT.jar:/app/wkt.jar:ro
    command: ["java","-jar","/app/wkt.jar"]

  frontend:
    image: nginx:stable-alpine
    ports:
      - 3000:80
    depends_on:
      - backend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres-data:
